---
name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - configs/**
      - claude-config/**
      - codex-config/**
      - crush-config/**
      - hermes-config/**
      - opencode-config/**
      - pi-config/**
      - omp-config/**
      - kilocode-config/**
      - .dockerignore
      - scripts/**
      - docker-compose.yml
      - tests/**
      - .devcontainer/**
      - .github/workflows/docker-publish.yml
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Least privilege by default. `packages: write` is granted only on the two jobs that
# actually publish to GHCR (the build jobs push per-arch images by digest; `merge` pushes the
# multi-arch manifest). `smoke-test-arm64` only pulls, so it gets `packages: read`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_IMAGE: ghcr.io/f5-sales-demo/devcontainer

jobs:
  trust-gate:
    name: Authorize Docker publication
    runs-on: managed-socketless
    permissions: {}
    steps:
      - name: Require a trusted publication event
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule | workflow_dispatch) exit 0 ;;
            push)
              if [[ "$REF" == "refs/heads/$DEFAULT_BRANCH" && "$REF_PROTECTED" == "true" ]]; then
                exit 0
              fi
              ;;
          esac
          echo "::error::Docker publication requires manual dispatch, schedule, or a protected default-branch push."
          exit 1

  # ── Main image: build each arch natively in parallel ──
  build-amd64:
    name: Build and push linux/amd64 image
    needs: trust-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.ref_protected == true)
    runs-on: managed-container-build
    # Pushes per-arch images to GHCR by digest.
    permissions:
      contents: read
      packages: write # Pushes the linux/amd64 image and registry cache to GHCR.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build metadata
        id: buildmeta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.MAIN_IMAGE }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=${{ env.MAIN_IMAGE }}:cache-linux-amd64
          cache-to: type=registry,ref=${{ env.MAIN_IMAGE }}:cache-linux-amd64,mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP_DIR}/digests"
          touch "${RUNNER_TEMP_DIR}/digests/${BUILD_DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-linux-amd64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build and push linux/arm64 image
    needs: trust-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.ref_protected == true)
    runs-on: ubuntu-24.04-arm
    # Pushes per-arch images to GHCR by digest.
    permissions:
      contents: read
      packages: write # Pushes the linux/arm64 image and registry cache to GHCR.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build metadata
        id: buildmeta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.MAIN_IMAGE }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=${{ env.MAIN_IMAGE }}:cache-linux-arm64
          cache-to: type=registry,ref=${{ env.MAIN_IMAGE }}:cache-linux-arm64,mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP_DIR}/digests"
          touch "${RUNNER_TEMP_DIR}/digests/${BUILD_DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-linux-arm64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge per-arch digests into a multi-arch manifest ──
  merge:
    name: Publish multi-architecture manifest
    runs-on: managed-container-build
    needs: [build-amd64, build-arm64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.ref_protected == true)
    # Pushes the multi-arch manifest to GHCR.
    permissions:
      contents: read
      packages: write # Publishes the multi-architecture manifest to GHCR.
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.MAIN_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value={{date 'YYYY.MM.DD'}}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.MAIN_IMAGE }}
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=$(printf "${IMAGE}@sha256:%s " *)
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $sources


  # ── Post-build smoke test (render-only in CI, no VPN/API keys) ──
  smoke-test-arm64:
    name: Smoke-test published linux/arm64 image
    runs-on: ubuntu-24.04-arm
    needs: merge
    # Only pulls the published image; no write scope needed.
    permissions:
      contents: read
      packages: read # Pulls the private published image from GHCR for validation.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        env:
          IMAGE: ${{ env.MAIN_IMAGE }}
        run: docker pull "${IMAGE}:latest"

      - name: Run smoke test (render-only)
        env:
          IMAGE: ${{ env.MAIN_IMAGE }}
        run: ./tests/smoke-test.sh "${IMAGE}:latest"
